version: '3.8'

services: 
  postgres:
    image: postgres:13
    container_name: opigt_postgres
    environment:
      POSTGRES_USER: OPIGT
      POSTGRES_PASSWORD: OpiGt2026
      POSTGRES:DB: OpiGt
    ports:
      - "5438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: